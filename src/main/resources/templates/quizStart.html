    <link rel="stylesheet" th:href="@{/css/quiz-ui.css}">
    <link id="theme-style" rel="stylesheet" th:href="@{/css/main-light.css(v=2)}">
    <script>
        // 다른 서브도메인에서 고른 테마 이어받기. 처음 온 사람은 밝게 (헤더가 뜨기 전에 미리 바꿔 깜빡임 막음)
        (function () {
            var m = document.cookie.match(/(?:^|;\s*)bw_theme=(light|dark)/);
            var t = m ? m[1] : null;
            try { t = t || localStorage.getItem('theme'); } catch (e) { }
            if (t === 'light' || t === 'dark') document.getElementById('theme-style').setAttribute('href', '/css/main-' + t + '.css?v=2');
        })();
    </script>

<body class="bw-quiz-body bw-svc-page">

<header id="global-header" aria-label="Binary World 공통 메뉴"></header>
<div class="page-title">
    <div class="bw-svc-toys" aria-hidden="true">
        <span class="bw-toy bw-toy-chip" style="--x:7%;--y:20%;--s:62px;--d:7s;--r0:-12deg;--r1:6deg;--c1:#c4b5fd;--c2:#7c3aed">?</span>
        <span class="bw-toy bw-toy-chip" style="--x:86%;--y:16%;--s:52px;--d:6.5s;--delay:-2s;--c1:#fde68a;--c2:#f59e0b">!</span>
        <span class="bw-toy bw-toy-dice" style="--x:88%;--y:64%;--s:56px;--d:8s;--delay:-1s;--r0:8deg;--r1:-10deg"></span>
        <span class="bw-toy bw-toy-chip" style="--x:5%;--y:66%;--s:48px;--d:7.5s;--delay:-3s;--c1:#f9a8d4;--c2:#db2777">A</span>
        <span class="bw-toy bw-toy-star" style="--x:20%;--y:8%;--s:34px;--d:6s;--delay:-4s"></span>
        <span class="bw-toy bw-toy-ball" style="--x:76%;--y:86%;--s:22px;--d:5s;--delay:-2s"></span>
    </div>
    <p class="bw-svc-eyebrow">Quiz</p>
    <h1>상식 테스트 <span class="bw-svc-em">문제 풀기</span></h1>
    <p>집중해서 풀고, 바로 다음으로 넘어가세요</p>
</div>

<div class="container-quiz">
    <div class="progress-bar">
        <div id="progress" class="progress" style="width: 0%;"></div>
    </div>
    <h3 id="question-title"></h3>
    <div id="quiz-options" class="quiz-options"></div>
    <div id="answer-message" class="answer-message"></div>
    <button id="next-btn" class="button-quiz" onclick="nextQuestion()" disabled>다음</button>
</div>

<footer id="global-footer" aria-label="Binary World 푸터"></footer>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        // 1. 햄버거 메뉴 토글
        const toggleBtn = document.querySelector('.nav-toggle');
        const nav = document.querySelector('.nav-links');

        if (toggleBtn && nav) {
            toggleBtn.addEventListener('click', () => {
                toggleBtn.classList.toggle('active');
                nav.classList.toggle('open');
            });
        }


        // URL에서 점수 가져오기
        var urlParams = new URLSearchParams(window.location.search);
        var score = urlParams.get('score');

        // 총 문제 수 및 결과 메시지 설정
        var totalQuestions = 10;
        var resultMessage = `총 ${totalQuestions}문제 중 ${score}문제를 맞추셨습니다!`;
        // 예전 결과 문구 자리 (없으면 건너뜀)
        var resultEl = document.getElementById("result-message");
        if (resultEl) resultEl.textContent = resultMessage;
    });

    var currentQuestion = 0;
    var score = 0;
    var selectedAnswer = null;
    var isAnswerChecked = false; // 정답 확인 여부 추가

    var quizData = /*[[${quizList}]]*/ [];

    function loadQuestion() {
        if (currentQuestion >= quizData.length) return;

        document.getElementById("question-title").textContent = quizData[currentQuestion].question;

        var optionsHtml = '';
        quizData[currentQuestion].options.forEach(function(option, index) {
            optionsHtml += `<div class="quiz-option" onclick="selectOption(${index})">${option}</div>`;
        });
        document.getElementById("quiz-options").innerHTML = optionsHtml;
        document.getElementById("next-btn").disabled = true; // 다음 버튼 비활성화
        selectedAnswer = null; // 새로운 질문이 로드될 때 선택한 답을 초기화
        isAnswerChecked = false; // 정답 확인 여부 초기화
        document.getElementById("answer-message").style.display = "none"; // 정답 메시지 숨김
    }

    function selectOption(selectedIndex) {
        selectedAnswer = selectedIndex; // 선택한 옵션을 기록

        var options = document.getElementsByClassName('quiz-option');
        for (var i = 0; i < options.length; i++) {
            options[i].classList.remove('selected');
        }
        options[selectedIndex].classList.add('selected');

        document.getElementById("next-btn").disabled = false; // 다음 버튼 활성화
    }

    function nextQuestion() {
        var answerMessage = document.getElementById("answer-message");

        if (!isAnswerChecked) { // 정답 확인 단계
            if (selectedAnswer === quizData[currentQuestion].answerIndex - 1) {
                score++;
                answerMessage.textContent = "정답입니다!";
                answerMessage.className = "answer-message correct";
            } else {
                answerMessage.textContent = "틀렸습니다. 정답은 '" + quizData[currentQuestion].options[quizData[currentQuestion].answerIndex - 1] + "' 입니다.";
                answerMessage.className = "answer-message incorrect";
            }
            answerMessage.style.display = "block"; // 메시지 표시
            isAnswerChecked = true; // 정답 확인 완료로 설정
            document.getElementById("next-btn").textContent = "다음 문제로";
        } else { // 다음 문제로 이동 단계
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                updateProgressBar();
                loadQuestion();
                document.getElementById("next-btn").textContent = "다음"; // 버튼 텍스트 초기화
            } else {
                window.location.href = '/quizResult?score=' + score;
            }
        }
    }

    function updateProgressBar() {
        var progressPercentage = (currentQuestion / quizData.length) * 100;
        document.getElementById("progress").style.width = progressPercentage + "%";
    }

    // 첫 번째 질문 로드
    loadQuestion();
</script>
<script th:src="${@environment.getProperty('bw.common', 'https://binaryworld.kr')} + '/common/service.js'" src="https://binaryworld.kr/common/service.js" defer></script>
<script src="https://binaryworld.kr/common/header.js" defer></script>
<script src="https://binaryworld.kr/common/footer.js" defer></script>

</html>
